  <title id="name">Action feedback and cross-agent acquisition in meta-space</title>
  <desc id="desc">Current cues enter the meta-space; execution outcomes feed back into memory. An articulated artifact is not a copy of competence: the recipient rebuilds links from own experience.</desc>
