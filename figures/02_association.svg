  <text x="158" y="326" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#52606F">Public</text>
  <path d="M 215.00,284.00 C 260.00,284.00 250.00,305.00 290.00,305.00" fill="none" stroke="#925433" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" />
