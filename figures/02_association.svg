<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="name desc">
  <title id="name">Associative activation and the disclosure boundary of information combinations</title>
  <desc id="desc">Route A activates the slower rush-hour expectation; the off-peak link stays stored. An organizational rule can place a boundary on an otherwise public date-location combination.</desc>
  <rect width="900" height="360" fill="#FFFFFF" />
  <text x="450" y="38" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="700" text-anchor="middle" fill="#1E2939">Associative activation and the disclosure boundary of information combinations</text>
