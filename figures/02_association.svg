  <path d="M 360.00,305.00 351.00,301.30 351.00,308.70 Z" fill="#925433" stroke="none" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" />
  <text x="385" y="299" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-weight="700" text-anchor="start" fill="#1E2939">Full schedule of an unpublished event</text>
  <text x="385" y="330" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#52606F">If an applicable rule restricts this combination, it is internal-only.</text>
