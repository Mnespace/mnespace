  <text x="372" y="171" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="middle" fill="#52606F">Off-peak</text>
  <text x="520" y="89" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#344F98">Currently active</text>
  <text x="520" y="174" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#52606F">Stored, inactive</text>
  <text x="672" y="108" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#344F98">~</text>
  <text x="695" y="114" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="700" text-anchor="start" fill="#344F98">22</text>
