  <path d="M 372.00,188.00 639.00,188.00" fill="none" stroke="#98A5BA" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="butt" stroke-dasharray="6 4" />
  <circle cx="99" cy="145" r="8" fill="#344F98" stroke="none" stroke-width="1.6" />
  <circle cx="372" cy="103" r="6" fill="#344F98" stroke="none" stroke-width="1.6" />
  <circle cx="372" cy="188" r="6" fill="#FFFFFF" stroke="#98A5BA" stroke-width="1.8" />
  <circle cx="643" cy="103" r="4.5" fill="#344F98" stroke="none" stroke-width="1.6" />
  <circle cx="643" cy="188" r="4.5" fill="#FFFFFF" stroke="#98A5BA" stroke-width="1.6" />
