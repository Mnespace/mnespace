  <path d="M 106.00,145.00 C 226.00,145.00 224.00,188.00 372.00,188.00" fill="none" stroke="#98A5BA" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="butt" stroke-dasharray="6 4" />
