  <text x="172" y="82" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#52606F">min</text>
  <text x="438" y="82" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#1E2939">Listener &amp; task</text>
