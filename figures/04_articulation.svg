  <circle cx="98" cy="223" r="5.3" fill="#344F98" stroke="none" stroke-width="1.6" />
  <circle cx="275" cy="115" r="5.3" fill="#344F98" stroke="none" stroke-width="1.6" />
  <path d="M 98.00,181.00 104.00,187.00 98.00,193.00 92.00,187.00 Z" fill="#FFFFFF" stroke="#52606F" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" />
  <path d="M 275.00,181.00 281.00,187.00 275.00,193.00 269.00,187.00 Z" fill="#FFFFFF" stroke="#52606F" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" />
