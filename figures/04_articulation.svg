  <circle cx="451" cy="277" r="2.6" fill="#344F98" stroke="none" stroke-width="1.6" />
  <text x="489" y="274" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#52606F">Same driver · review</text>
  <text x="489" y="300" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#1E2939">Off-peak A is faster; check the time slot next time.</text>
