<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-labelledby="name desc">
  <title id="name">One trip memory, expressed for three communicative tasks</title>
  <desc id="desc">Route A takes about 10 min off-peak and 22 min at rush hour; Route B about 14 min either way. Each expression selects content for the listener's current task.</desc>
  <rect width="900" height="330" fill="#FFFFFF" />
  <text x="450" y="40" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="700" text-anchor="middle" fill="#1E2939">One trip memory, expressed for three communicative tasks</text>
