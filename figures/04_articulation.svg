  <text x="312" y="123" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-weight="700" text-anchor="middle" fill="#344F98">22</text>
  <text x="59" y="194" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-weight="700" text-anchor="middle" fill="#52606F">14</text>
  <text x="312" y="194" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-weight="700" text-anchor="middle" fill="#52606F">14</text>
  <text x="98" y="265" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#1E2939">Off-peak</text>
  <text x="275" y="265" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#1E2939">Rush hour</text>
