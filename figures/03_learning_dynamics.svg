<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="404" viewBox="0 0 900 404" role="img" aria-labelledby="name desc">
  <title id="name">Three kinds of feedback-driven memory update</title>
  <desc id="desc">Repeated experience sediments stable links; calibration revises an estimate within a situation; restructuring redraws situation boundaries. Cross-event persistence distinguishes durable change.</desc>
